name: Deploy site

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Refresh citation counts daily at 04:23 UTC, away from the hourly rush.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cache citation snapshots
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            .jekyll-cache/Jekyll/Cache/ScholarProfile
            .jekyll-cache/Jekyll/Cache/Jekyll--Cache
          key: scholar-profile-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scholar-profile-v1-${{ runner.os }}-
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y imagemagick
          convert -version
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install locked tools
        run: npm ci
      - name: Check application code
        run: npm test
      - name: Build production site
        env:
          JEKYLL_ENV: production
          SEARCHAPI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.SEARCHAPI_API_KEY || '' }}
          # A unique attempt ID refreshes once per profile, regardless of cache age.
          SCHOLAR_REFRESH_ID: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        run: |
          pip3 install nbconvert==7.17.1
          npm run build
          ruby - <<'RUBY'
          key = ENV["SEARCHAPI_API_KEY"].to_s.strip
          unless key.empty?
            Dir.glob("_site/**/*", File::FNM_DOTMATCH).each do |path|
              next unless File.file?(path)
              abort "API key found in generated output; deployment stopped." if File.binread(path).include?(key)
            end
            puts "Verified: API key is absent from generated files."
          end
          RUBY
      - name: Install pinned link checker
        run: bash bin/install-lychee.sh
      - name: Check generated links and assets before deployment
        run: lychee --offline --root-dir "$GITHUB_WORKSPACE/_site" --no-progress '_site/**/*.html'
      - name: Save the checked production build
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: _site/
          include-hidden-files: true
          retention-days: 7
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
