name: Deploy site

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Refresh citation counts daily at 04:23 UTC, away from the hourly rush.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y imagemagick
          convert -version
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install locked tools
        run: npm ci
      - name: Check application code
        run: |
          node --check assets/js/portfolio.js
          bundle exec ruby tests/scholar_profile_test.rb
          bundle exec ruby tests/cache_bust_test.rb
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: |
          pip3 install nbconvert==7.17.1
          bundle exec jekyll build --lsi
          npm run css:purge
      - name: Install pinned link checker
        run: bash bin/install-lychee.sh
      - name: Check generated links and assets before deployment
        run: lychee --offline --root-dir "$GITHUB_WORKSPACE/_site" --no-progress '_site/**/*.html'
      - name: Save the checked production build
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: _site/
          include-hidden-files: true
          retention-days: 7
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
