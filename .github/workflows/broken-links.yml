name: Check for broken links

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned link checker
        run: bash bin/install-lychee.sh
      - name: Check maintained source content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Original theme documentation and the excluded Einstein sample are
        # reference material. Liquid routes/assets are checked after rendering.
        run: >-
          lychee --no-progress --max-retries 2 --timeout 20 --exclude-loopback
          --exclude-path _pages/about_einstein.md --exclude-path _pages/404.md
          README.md CLAUDE.md '_pages/*.md' '_news/*.md' '_projects/*.md'
