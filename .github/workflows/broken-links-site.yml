name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  check-links-on-site:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Inspect the exact production output, without rebuilding another revision.
      - name: Download the checked production build
        uses: actions/download-artifact@v5
        with:
          name: production-site
          path: _site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check generated links and assets
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --root-dir "${{ github.workspace }}/_site" --no-progress '_site/**/*.html'
          fail: true
